name: hhc-line-bot-periodic-assurance
type: Microsoft.App/jobs
location: PLACEHOLDER_AZURE_REGION
identity:
  type: UserAssigned
  userAssignedIdentities:
    PLACEHOLDER_ATTACHMENT_JOB_IDENTITY_ID: {}
properties:
  environmentId: PLACEHOLDER_CONTAINER_APP_ENVIRONMENT_ID
  configuration:
    registries:
      - server: alive.azurecr.io
        identity: PLACEHOLDER_ATTACHMENT_JOB_IDENTITY_ID
    triggerType: Manual
    replicaTimeout: 600
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: graph-client-secret
        value: PLACEHOLDER_COPY_FROM_BOT_SECRET
      - name: notion-token
        value: PLACEHOLDER_COPY_FROM_BOT_SECRET
      - name: attachment-scan-queue-connection-string
        value: PLACEHOLDER_ATTACHMENT_SCAN_QUEUE_CONNECTION_STRING
  template:
    containers:
      - name: periodic-assurance
        image: alive.azurecr.io/alive/hhc-line-function-bot:latest
        args:
          - dist/tools/run-periodic-assurance.js
        env:
          - name: GRAPH_TENANT_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_CLIENT_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_CLIENT_SECRET
            secretRef: graph-client-secret
          - name: GRAPH_DRIVE_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_XIAOHA_OTHER_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: NOTION_TOKEN
            secretRef: notion-token
          - name: NOTION_SERVICE_DATABASE_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: ATTACHMENT_SCAN_QUEUE_CONNECTION_STRING
            secretRef: attachment-scan-queue-connection-string
          - name: ATTACHMENT_SCAN_QUEUE_NAME
            value: PLACEHOLDER_ATTACHMENT_SCAN_QUEUE_NAME
          - name: ASSET_API_URL
            value: PLACEHOLDER_ASSET_API_URL
          - name: ASSET_API_AUDIENCE
            value: PLACEHOLDER_ASSET_API_AUDIENCE
          - name: AZURE_CLIENT_ID
            value: PLACEHOLDER_ATTACHMENT_JOB_CLIENT_ID
        resources:
          cpu: 0.25
          memory: 0.5Gi
    volumes: []
