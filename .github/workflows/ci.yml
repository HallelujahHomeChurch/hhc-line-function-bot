name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 11.7.0

jobs:
  validate:
    name: PR CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: line_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d line_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KERNEL_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/line_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI contract
        run: pnpm --package=@redocly/cli@2.47.0 dlx redocly lint docs/openapi.yaml
      - name: Test OpenAPI contract
        run: pnpm vitest run --config docs/vitest.config.ts docs/openapi-contract.test.ts
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check architecture boundaries
        run: pnpm architecture:check
      - name: Test
        run: pnpm test
      - name: Prove PostgreSQL media-sync suite executed
        run: pnpm vitest run src/__tests__/media-sync-store.test.ts
      - name: Validate production profile config
        run: pnpm config:validate
      - name: Controlled agent eval
        run: pnpm eval:agent
      - name: Kernel v1 acceptance gate
        run: pnpm eval:kernel
      - name: Kernel v1 real-dependency integration gate
        run: pnpm eval:kernel:integration
      - name: Compile app
        run: pnpm build
