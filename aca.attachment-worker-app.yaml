name: hhc-line-bot-attachment-worker
type: Microsoft.App/containerApps
location: PLACEHOLDER_AZURE_REGION
identity:
  type: UserAssigned
  userAssignedIdentities:
    PLACEHOLDER_ATTACHMENT_JOB_IDENTITY_ID: {}
properties:
  managedEnvironmentId: PLACEHOLDER_CONTAINER_APP_ENVIRONMENT_ID
  configuration:
    activeRevisionsMode: Single
    registries:
      - server: alive.azurecr.io
        identity: PLACEHOLDER_ATTACHMENT_JOB_IDENTITY_ID
    secrets:
      - name: line-helper-channel-access-token
        value: PLACEHOLDER_COPY_FROM_BOT_SECRET
      - name: graph-client-secret
        value: PLACEHOLDER_COPY_FROM_BOT_SECRET
      - name: database-url
        value: PLACEHOLDER_COPY_FROM_BOT_SECRET
      - name: redis-url
        value: PLACEHOLDER_COPY_FROM_BOT_SECRET
  template:
    scale:
      minReplicas: 0
      maxReplicas: 1
      pollingInterval: 1
      cooldownPeriod: 120
      rules:
        - name: attachment-work
          custom:
            type: azure-queue
            metadata:
              accountName: PLACEHOLDER_ATTACHMENT_SCAN_STORAGE_ACCOUNT_NAME
              queueName: PLACEHOLDER_ATTACHMENT_SCAN_QUEUE_NAME
              queueLength: "1"
            identity: PLACEHOLDER_ATTACHMENT_JOB_IDENTITY_ID
        - name: media-sync-warm
          custom:
            type: azure-queue
            metadata:
              accountName: PLACEHOLDER_ATTACHMENT_SCAN_STORAGE_ACCOUNT_NAME
              queueName: PLACEHOLDER_MEDIA_SYNC_WARM_QUEUE_NAME
              queueLength: "1"
            identity: PLACEHOLDER_ATTACHMENT_JOB_IDENTITY_ID
    containers:
      - name: attachment-worker
        image: alive.azurecr.io/alive/hhc-line-function-bot:latest
        args:
          - dist/tools/run-attachment-worker.js
          - --loop
        env:
          - name: SERVICE_NAME
            value: hhc-line-bot-attachment-worker
          - name: PROFILE_CONFIG_PATH
            value: /app/config/profiles.json
          - name: LINE_HELPER_CHANNEL_ACCESS_TOKEN
            secretRef: line-helper-channel-access-token
          - name: DATABASE_URL
            secretRef: database-url
          - name: DATABASE_SSL
            value: "true"
          - name: REDIS_URL
            secretRef: redis-url
          - name: REDIS_KEY_PREFIX
            value: hhc-line-function-bot
          - name: ATTACHMENT_SCAN_QUEUE_URL
            value: https://PLACEHOLDER_ATTACHMENT_SCAN_STORAGE_ACCOUNT_NAME.queue.core.windows.net/PLACEHOLDER_ATTACHMENT_SCAN_QUEUE_NAME
          - name: MEDIA_SYNC_WARM_QUEUE_URL
            value: https://PLACEHOLDER_ATTACHMENT_SCAN_STORAGE_ACCOUNT_NAME.queue.core.windows.net/PLACEHOLDER_MEDIA_SYNC_WARM_QUEUE_NAME
          - name: ASSET_API_URL
            value: PLACEHOLDER_ASSET_API_URL
          - name: ASSET_API_AUDIENCE
            value: PLACEHOLDER_ASSET_API_AUDIENCE
          - name: MEETING_API_BASE_URL
            value: PLACEHOLDER_MEETING_API_URL
          - name: MEETING_API_AUDIENCE
            value: PLACEHOLDER_MEETING_API_AUDIENCE
          - name: AZURE_CLIENT_ID
            value: PLACEHOLDER_ATTACHMENT_JOB_CLIENT_ID
          - name: MAX_ATTACHMENT_BYTES
            value: "26214400"
          - name: MEDIA_SYNC_MAX_BYTES
            value: "209715200"
          - name: LINE_CONTENT_DOWNLOAD_TIMEOUT_MS
            value: "30000"
          - name: EXTERNAL_RESOURCE_DOWNLOAD_TIMEOUT_MS
            value: "15000"
          - name: EXTERNAL_RESOURCE_MAX_REDIRECTS
            value: "3"
          - name: GRAPH_TENANT_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_CLIENT_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_CLIENT_SECRET
            secretRef: graph-client-secret
          - name: GRAPH_DRIVE_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_PPT_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_POP_SHEET_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_POP_SHEET_DRIVE_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_HYMN_SHEET_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_XIAOHA_DOCUMENT_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_XIAOHA_IMAGE_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_XIAOHA_OTHER_FOLDER_ITEM_ID
            value: PLACEHOLDER_COPY_FROM_BOT_ENV
          - name: GRAPH_LINK_SCOPE
            value: anonymous
          - name: GRAPH_LINK_TYPE
            value: view
          - name: SHEET_MUSIC_ALLOWED_EXTENSIONS
            value: pdf,jpg,jpeg,png
        resources:
          cpu: 0.5
          memory: 1Gi
    volumes: []
