services:
  acceptance-app:
    image: ${KERNEL_LOCAL_LIVE_IMAGE:?}
    command: ["node", "dist/testing/kernel-local-live/app-main.js"]
    environment:
      KERNEL_LOCAL_LIVE_RUN_ID: ${KERNEL_LOCAL_LIVE_RUN_ID:?}
      KERNEL_LOCAL_LIVE_CASE_ID: ${KERNEL_LOCAL_LIVE_CASE_ID:-}
      KERNEL_LOCAL_LIVE_POSTGRES_URL: postgresql://kernel:kernel@postgres:5432/hhc_line_acceptance
      KERNEL_LOCAL_LIVE_REDIS_URL: redis://redis:6379
    secrets:
      - source: deepseek-api-key
        target: deepseek-api-key
        mode: 0600
      - source: azure-openai-embedding-key
        target: azure-openai-embedding-key
        mode: 0600
    networks:
      - acceptance-internal
      - provider-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 3s

  acceptance-driver:
    image: ${KERNEL_LOCAL_LIVE_IMAGE:?}
    command: ["node", "dist/tools/eval-kernel-local-live.js"]
    environment:
      KERNEL_LOCAL_LIVE_APP_URL: http://acceptance-app:3000/
      KERNEL_LOCAL_LIVE_REDIS_URL: redis://redis:6379
      KERNEL_LOCAL_LIVE_RUN_ID: ${KERNEL_LOCAL_LIVE_RUN_ID:?}
      KERNEL_LOCAL_LIVE_COMMIT: ${KERNEL_LOCAL_LIVE_COMMIT:?}
      KERNEL_LOCAL_LIVE_CASE_ID: ${KERNEL_LOCAL_LIVE_CASE_ID:-}
      KERNEL_LOCAL_LIVE_ARTIFACT_ROOT: /app
    volumes:
      - ${KERNEL_LOCAL_LIVE_ARTIFACT_DIRECTORY:?}:/app/artifacts/kernel-v1
    networks:
      - acceptance-internal
    depends_on:
      acceptance-app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: hhc_line_acceptance
      POSTGRES_USER: kernel
      POSTGRES_PASSWORD: kernel
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/kernel-local-live/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    networks:
      - acceptance-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U kernel -d hhc_line_acceptance && psql -U kernel -d hhc_line_acceptance -tAc "select 1 from pg_extension where extname=''vector''" | grep -q 1'
        ]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 3s

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - acceptance-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 2s

secrets:
  deepseek-api-key:
    file: ${KERNEL_DEEPSEEK_SECRET_FILE:?}
  azure-openai-embedding-key:
    file: ${KERNEL_AZURE_EMBEDDING_SECRET_FILE:?}

networks:
  acceptance-internal:
    internal: true
  provider-egress:

volumes:
  postgres-data:
  redis-data:
